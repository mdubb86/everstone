[project]
name = "everstone-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pytest>=8", "requests>=2.31", "caldav>=1.3", "icalendar>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.pytest.ini_options]
testpaths = ["."]
