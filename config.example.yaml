# EverStone configuration. Copy to config.yaml (gitignored) and fill in.

# Public HTTPS URL that clients (Obsidian, Tasks.org, your phone) use to reach
# this server. Must be https — Obsidian rejects http.
public_url: https://everstone.example.com

# CouchDB credentials (used by Obsidian LiveSync at /db).
couchdb:
  user: everstone
  password: CHANGE_ME              # any strong password
  database: everstone

# CalDAV credentials (used by Tasks.org / macOS Reminders at /caldav/<user>/).
caldav:
  user: everstone
  password: CHANGE_ME

# LiveSync E2E encryption passphrase. Must match Obsidian LiveSync plugin.
# (Path obfuscation reuses the same passphrase by design — see livesync docs.)
livesync:
  passphrase: CHANGE_ME

# Agent name. Used to seed SOUL.md (Hermes's persona/identity file) on first
# boot. Hermes intentionally NEVER overwrites SOUL.md after that — to change
# the agent's voice later, edit /opt/data/hermes/SOUL.md directly.
agent_name: Everstone

# Obsidian vault name (informational; used in deeplinks).
obsidian:
  vault_name: Everstone

# Telegram bot. Get bot_token from @BotFather; owner_user_id from @userinfobot.
telegram:
  owner_user_id: 123456789         # integer, your Telegram user id
  bot_token: 1234567890:CHANGE_ME  # from BotFather

# LLM model the agent uses. Examples: openai/gpt-5-codex, anthropic/claude-sonnet-4-6
hermes:
  model: openai/gpt-5-codex
