# EverStone configuration. Copy to config.yaml (gitignored) and fill in.

# CouchDB credentials (used by Obsidian LiveSync at /db).
couchdb:
  user: everstone
  password: CHANGE_ME              # any strong password
  database: everstone

# CalDAV credentials (used by Tasks.org / macOS Reminders at /caldav/<user>/).
caldav:
  user: everstone
  password: CHANGE_ME

# LiveSync encryption passphrases. Must match Obsidian LiveSync plugin config.
livesync:
  passphrase: CHANGE_ME            # the E2E encryption passphrase
  obfuscate_passphrase: CHANGE_ME  # the path obfuscation passphrase

# Obsidian vault name (informational; used in deeplinks).
obsidian:
  vault_name: everstone

# Agent identity. Shows up in agent self-reference.
instance:
  name: Jarvis

# Telegram bot. Get bot_token from @BotFather; owner_user_id from @userinfobot.
telegram:
  owner_user_id: 123456789         # integer, your Telegram user id
  bot_token: 1234567890:CHANGE_ME  # from BotFather

# LLM model the agent uses. Examples: openai/gpt-5-codex, anthropic/claude-sonnet-4-6
hermes:
  model: openai/gpt-5-codex
