[project]
name = "radfire"
version = "0.1.0"
description = "Radicale CalDAV server with webhook event emission"
requires-python = ">=3.11"
dependencies = [
    "radicale>=3.2",
    "vobject>=0.9.7",
]

[project.scripts]
radfire = "radfire.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
