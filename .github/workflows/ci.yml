name: CI

# Fast validation on every main push + PR — catches code/test breakage BEFORE a
# release tag triggers the (heavy) image build. This does NOT build or publish the
# image; the release workflow (build.yml, on v* tags) is the only thing that does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install es + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./es
          # typer is for scripts/everstone_cli.py (the esadmin CLI); es itself no
          # longer depends on it, so install it explicitly for scripts/tests.
          # reportlab builds the es_doc PDF fixtures (es/tests/conftest.py); it's in
          # es/pyproject.toml's dev group, which this manual pip list must mirror.
          pip install pytest radicale requests jsonschema typer reportlab

      - name: es tests
        run: pytest es/tests -q

      - name: scripts tests
        run: PYTHONPATH=scripts pytest scripts/tests -q

      # camofox-plugins/fingerprint ships INTO the image (it pins the device identity that
      # keeps authenticated sessions from being re-verified), and it has node:test unit
      # tests. Nothing ran them before this step, so they were decorative. Pure Node, no
      # container, no deps — unlike e2e/, which needs a built image and is deliberately
      # left out of this fast gate.
      # Glob the test files, NOT the directory: `node --test <dir>` treats every .js in it
      # as a test, including index.js — which imports camoufox-js and so only resolves
      # inside the image. The *.test.js files import only the pure modules.
      - name: camofox plugin tests
        run: node --test camofox-plugins/fingerprint/*.test.js
