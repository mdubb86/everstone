name: Build and publish container

# Builds the EverStone image and publishes it to the GitHub Container Registry
# (ghcr.io/mdubb86/everstone). Requires the repository to be public (or GHCR
# enabled) for the GITHUB_TOKEN to push packages.

on:
  # Release-driven: a `v*` tag is the ONLY thing that builds + publishes. Pushing
  # to main does NOT build — that's deliberate, so cutting a release (push main +
  # tag) triggers exactly one run, not two (one per ref).
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # mdubb86/everstone

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The image is multi-stage and large (CouchDB from source, Caddy via
      # xcaddy, deno deps). Reclaim runner disk so the build doesn't run out.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A v0.1.1 tag produces: :0.1.1 (full version), :0.1 (major.minor),
          # :latest (always the newest release), and :sha-<short> (exact commit).
          # IMPORTANT: every line below must be a bare `type=...` spec — metadata-action
          # treats an inline `#` as part of the value, not a comment (it does NOT parse
          # YAML comments inside this block scalar). Keep docs out here, above `tags:`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
