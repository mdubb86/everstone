project:
  name: everstone

# everstone's multi-stage build is disk-heavy (CouchDB/Erlang from source, the
# Hermes venv, the ~300MB Camoufox binary, Firefox libs) and Docker CE's containerd
# snapshotter keeps compressed content + extracted snapshots at once (~2x peak).
# The 32GB default is tight; 64GB gives headroom for the build + cross-run cache.
disk: "64GB"

# Docker as a first-class devm feature (devm 0.7): installs Docker in the VM AND
# makes container egress trust iron-proxy transparently. everstone builds + runs
# as a Docker container *inside* the VM (couchdb/caddy/radicale/hermes/engraph).
# This supersedes the old hand-rolled `packages: [docker.io]` + docker.socket
# SocketGroup override — the feature owns daemon install and guest-user access.
docker: true

# Apt packages installed at VM creation. everstone's dev workflow is entirely
# `just`-driven (build/dev/es/esadmin/e2e); trixie ships `just` in apt.
packages:
  - just
  - build-essential     # Orca ADE relay: node-gyp toolchain — its node-pty compiles from
                        # source on first attach (no linux-arm64 prebuilt)

# Named script library (devm 0.10): reusable multi-command shell snippets,
# referenced from `install:`/`startup:` by a single `>NAME` entry. Keeps the
# install list readable and matches the shape `devm recipes` publishes.
scripts:
  # Claude Code — per `devm recipes get tool/ai/claude`, adapted for this VM.
  # Two paths matter and the recipe creates both:
  #   /usr/local/bin/claude        the real binary, on the default system PATH
  #                                (survives login-shell PATH resets).
  #   ~devm/.local/bin/claude      the canonical path Claude self-checks for; it
  #                                warns/refuses some operations without it.
  # `sudo` on the privileged steps rather than the recipe's bare form: it is a
  # no-op when provisioning runs as root and required when it runs as `devm`
  # (which has passwordless sudo), so this works either way. Likewise `$HOME`
  # instead of a hardcoded /root — the installer drops the versioned binary under
  # whichever HOME it ran with. State (OAuth, transcripts, memory) is NOT here —
  # it lives in the `claude` volume below.
  install-claude-cli:
    - curl -fsSL https://claude.ai/install.sh | bash
    - sudo install -m 755 "$HOME/.local/share/claude/versions/"* /usr/local/bin/claude
    - sudo install -d -o devm -g devm /home/devm/.local/bin
    - sudo ln -sf /usr/local/bin/claude /home/devm/.local/bin/claude

# Egress is UNRESTRICTED during provisioning; the iron-proxy allowlist below only
# gates the running VM. `install:` is first-boot-only (marker-gated) and is in the
# RECREATE bucket — edits here take effect on the next cold start, not live.
install:
  - ">install-claude-cli"

# Claude Code state (OAuth login + conversation transcripts + memory) persists via
# the `claude` VOLUME below (devm 0.9), mounted at Claude's DEFAULT ~/.claude
# (/home/devm/.claude). Volumes live Mac-side under
# ~/Library/Application Support/devm/volumes/<project>/ and survive `devm teardown`,
# so the old CLAUDE_CONFIG_DIR redirect into .devm/.claude is no longer needed.
env:
  # Moved from project.hostname_apex (deprecated in devm 0.3). Exposed to templates
  # as {{.Env.HOSTNAME_APEX}}; not used by Caddy/devm — just a template variable.
  HOSTNAME_APEX: test.everstone.waage.haus
  # Kill Sentry error reporting + telemetry (cleaner than allowlisting *.sentry.io).
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  # everstone's /opt/data binds from here. $WORKSPACE expands to the repo root at
  # load time; .devm/ is gitignored and rides the workspace bind-mount (Mac-side),
  # surviving `devm teardown`. (Claude state moved to the `claude` volume below.)
  EVERSTONE_DATA_DIR: $WORKSPACE/.devm/.everstone
  # Maps Platform API key — kept out of the VM entirely. This `!secret` ref makes
  # devm resolve `google_api_key` from the macOS keychain and hand iron-proxy the
  # real value; the VM/config only ever see the opaque token
  # `__DEVM_SECRET_google_api_key__`. es reads the key from config.yaml (not this
  # env var), where the same token is set; iron-proxy substitutes the real key on
  # egress to the Maps hosts bound under network.allow below. The env var is the
  # resolution trigger + a paper trail; nothing in es consumes it.
  GOOGLE_API_KEY: !secret google_api_key

# Persistent named volumes (devm 0.9): Mac-backed stores mounted into the guest that
# survive `devm teardown` (unlike the VM disk and unlike masks). Add/retarget is a
# restart-bucket change (VM stop + ~5s cold start, no data loss).
volumes:
  # Claude Code state at its DEFAULT path (~/.claude for the guest `devm` user):
  # OAuth login (.credentials.json), conversation transcripts (projects/), plugins,
  # sessions, settings. Replaces the old CLAUDE_CONFIG_DIR redirect. Mac-side dir:
  # ~/Library/Application Support/devm/volumes/everstone/claude/.
  claude: /home/devm/.claude

# iron-proxy egress allowlist (per-project; enforced by SNI/Host on the Mac).
# Gates the RUNNING VM only — install steps above run with unrestricted egress.
# iron-proxy egress allowlist. `docker: true` auto-allows the Docker Hub hosts, BUT
# a live `devm reconcile` rebuilds the running allowlist from THIS list and drops the
# implicit ones — so we pin them explicitly here to survive reconciles. The rest are
# what the image build + agent need: Alpine, Go (caddy), CouchDB source, Rust/engraph
# crates, Python wheels, JSR (livesync-bridge/Deno), Telegram bot API, ChatGPT/Codex.
network:
  allow:
    # Docker Hub (buildkit `docker/dockerfile` frontend + base-image pulls)
    - registry-1.docker.io
    - auth.docker.io
    - production.cloudfront.docker.com
    - dl-cdn.alpinelinux.org
    - go.dev
    - dl.google.com               # go.dev/dl/* 302-redirects here for the tarball
    - storage.googleapis.com
    - proxy.golang.org
    - sum.golang.org
    - github.com
    - api.github.com              # uv git-dependency resolution (.[all]) + gh metadata
    - objects.githubusercontent.com     # legacy GitHub release-asset CDN
    - release-assets.githubusercontent.com  # current GitHub release-asset CDN (xcaddy/s6/deno/camoufox)
    - registry.npmjs.org          # npm install (camofox-browser) + deno npm: deps
    - nodejs.org                  # Orca ADE relay: node-gyp fetches matching node headers on attach
    - archive.apache.org
    - crates.io
    - static.crates.io
    - index.crates.io
    - pypi.org
    - files.pythonhosted.org
    - jsr.io
    # livesync-bridge (notes sync) — deno fetches its deps from these at build
    # pre-cache time and at runtime. jsr.io + registry.npmjs.org (above/below)
    # cover jsr/npm specifiers; these cover deno.land/x + deno's own downloads.
    - deno.land
    - dl.deno.land
    - api.telegram.org
    # Hermes' Telegram adapter discovers Telegram API fallback IPs via DNS-over-HTTPS
    # before connecting; without these the connection stalls (attempt N/8).
    - cloudflare-dns.com
    - dns.google
    - chatgpt.com
    - "*.openai.com"
    # Claude Code — self-contained allowlist (per `devm recipes get tool/ai/claude`)
    - api.anthropic.com         # Claude API (core)
    - claude.ai                 # OAuth login + install.sh
    - platform.claude.com       # Console account auth
    - downloads.claude.ai       # native installer + plugin downloads
    - raw.githubusercontent.com # plugin marketplace + /release-notes
    - deb.debian.org     # VM base (Ubuntu/Debian) apt packages
    - security.debian.org
    - addons.mozilla.org # Firefox add-ons
    # Agent web_search (Hermes' keyless `ddgs` backend fans out across engines) +
    # reference sites the agent fetches. Add engines here as ddgs adds/denies them.
    - html.duckduckgo.com
    - search.brave.com
    - search.yahoo.com
    - www.google.com
    - www.mojeek.com
    - www.startpage.com
    - en.wikipedia.org
    - grokipedia.com
    # Google web surfaces for the persistent-web-login browser (Camoufox): the sign-in
    # flow (accounts.google.com) and Maps/other Google apps fan out across many *.google.com
    # subdomains, with static assets on gstatic, APIs on googleapis, user content on
    # googleusercontent, and Maps/Photos image tiles on ggpht. Wildcards because Google
    # rotates subdomains dynamically — enumerating exact hosts breaks the login flow.
    - "*.google.com"
    - "*.gstatic.com"
    - "*.googleapis.com"
    - "*.googleusercontent.com"
    - "*.ggpht.com"
    # Maps Platform (es_maps_* tools): the *.googleapis.com wildcard above already
    # permits egress, but secret INJECTION requires exact-host {host, secrets}
    # entries. es sends the `__DEVM_SECRET_google_api_key__` token as the key
    # (X-Goog-Api-Key header for Places/Routes; ?key= query param for legacy
    # Geocoding); iron-proxy substitutes the real key only on requests to these
    # three hosts. Nothing else in the VM carries the token, so nothing else leaks it.
    - host: maps.googleapis.com          # Geocoding API (legacy GET, ?key=)
      secrets: [google_api_key]
    - host: places.googleapis.com        # Places API (New) — search + details
      secrets: [google_api_key]
    - host: routes.googleapis.com        # Routes API — directions + matrix
      secrets: [google_api_key]

# everstone's internal Caddy serves the sync surfaces (/db, /caldav, /git, /health)
# inside the VM. It MUST NOT publish on VM :80 — devm runs its OWN Caddy on :80 to
# front `hostname` services (and reverse-proxies each hostname to localhost:<port>).
# So the dev container publishes on VM :8080 (`just dev` -p 8080:80) and this
# service points there; devm's Caddy fronts everstone.test → localhost:8080.
# `expose_host: true` opts the hostname into devm's shared LAN dispatcher on
# <mac-lan-ip>:42000 (devm 0.9.7 — the old "0.0.0.0:80" bind-IP is ignored). LAN
# path: NPM (holding the trusted cert for the public apex) forwards to
# <mac-lan-ip>:42000 preserving the Host header; devm dispatches by Host → this
# service. The hostname below is what NPM must send as Host.
services:
  everstone:
    port: 8080
    hostname: everstone.test
    expose_host: true
