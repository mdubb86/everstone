project:
  name: everstone

# everstone's multi-stage build is disk-heavy (CouchDB/Erlang from source, the
# Hermes venv, the ~300MB Camoufox binary, Firefox libs) and Docker CE's containerd
# snapshotter keeps compressed content + extracted snapshots at once (~2x peak).
# The 32GB default is tight; 64GB gives headroom for the build + cross-run cache.
disk: "64GB"

# VM RAM (restart bucket). The 4G default OOM-kills the in-VM Claude/Orca session
# when the full everstone container is also running. 6G physical + devm's auto-swap
# (50% → 3G) gives a 9G virtual ceiling for spikes while reserving less Mac RAM than
# a flat 8G. Applied on the next VM restart (stop + start).
memory: "6G"

# Docker as a first-class devm feature: installs Docker in the VM AND makes container
# egress trust iron-proxy transparently. everstone builds + runs as a Docker container
# *inside* the VM (couchdb/caddy/radicale/hermes/engraph). Auto-allows the Docker Hub
# hosts, but a live reconcile drops the implicit ones — so they're pinned in
# network.allow below.
docker: true

# git-clone workspace model: the VM hydrates by cloning origin into a per-project
# volume and mutagen-syncing it against this Mac project dir, so Mac and VM stay in
# step. The primary repo omits `url:` (derived from `git remote get-url origin`) and
# is marked primary. gh_token authenticates the VM's own git push over HTTPS (the
# repo is public so the clone needs no auth, but push does — iron-proxy injects the
# token on egress to github.com, see network.allow).
#
# `ignore:` replaces the old top-level `masks:` — es/.venv and e2e/.venv stay
# guest-local (NOT mutagen-synced to the Mac). uv/pytest write linux-aarch64 native
# .so files + a VM-only python symlink into .venv; syncing those back would collide
# with the Mac clone's own venvs (same failure class as node_modules).
repos:
  everstone:
    secret: gh_token
    primary: true
    ignore:
      - es/.venv
      - e2e/.venv

# Apt packages installed at VM creation. everstone's dev workflow is entirely
# `just`-driven (build/dev/es/esadmin/e2e); trixie ships `just` in apt.
packages:
  - just
  - build-essential     # Orca ADE relay: node-gyp toolchain — its node-pty compiles from
                        # source on first attach (no linux-arm64 prebuilt)
  - unzip               # fnm install (tool/lang/node) downloads a zipped binary

# PATH additions for every shell — login, non-login SSH (Orca relay, `just`),
# services, scripts — with no shell hook:
#   - fnm's `default` alias bin → node/npm/npx (tracks the active default node
#     version, so `fnm default <ver>` needs no devm.yaml change).
#   - ~/.local/bin → uv. uv's installer lands it here and only wires ~/.profile
#     (login shells); without this entry `just`/Orca (non-login) can't find uv.
#     Also exposes the pre-seeded python3.12 symlink, though `uv run`/`uv venv`
#     resolve the managed interpreter without needing it on PATH.
path:
  - /home/devm/.local/share/fnm/aliases/default/bin
  - /home/devm/.local/bin

# Project-wide environment (live bucket). Claude Code state (OAuth login +
# conversation transcripts + memory) persists via the `claude` VOLUME below, mounted
# at Claude's DEFAULT ~/.claude.
env:
  # Exposed to templates as {{.Env.HOSTNAME_APEX}}; not used by Caddy/devm — just a
  # template variable.
  HOSTNAME_APEX: test.everstone.waage.haus
  # Kill Sentry error reporting + telemetry (cleaner than allowlisting *.sentry.io).
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  # Never let uv auto-fetch a CPython at runtime — the download host is an
  # un-allowlistable signed redirect (see preseed-python in devm.sh). `manual` makes
  # uv use only the interpreter pre-seeded in the boot window; a miss fails loudly
  # rather than hanging on a blocked fetch.
  UV_PYTHON_DOWNLOADS: manual
  # everstone's /opt/data binds from here. In the clone model this MUST be a
  # persistent volume (see `everstone-data` under volumes: below): a gitignored
  # workspace dir would be wiped by the fresh clone. The volume survives teardown.
  EVERSTONE_DATA_DIR: /home/devm/.everstone
  # config.yaml must ALSO live in the persistent volume, not the workspace root — the
  # fresh clone wipes a gitignored root file the same way it wiped the data dir. The
  # Justfile's CONFIG var reads this override (env_var_or_default EVERSTONE_CONFIG).
  EVERSTONE_CONFIG: /home/devm/.everstone/config.yaml
  # Maps Platform API key — kept out of the VM entirely. This `!secret` ref makes devm
  # resolve `google_api_key` from the macOS keychain and hand iron-proxy the real
  # value; the VM/config only ever see the opaque token `__DEVM_SECRET_google_api_key__`.
  # es reads the key from config.yaml (not this env var); iron-proxy substitutes the
  # real key on egress to the Maps hosts bound under network.allow below.
  GOOGLE_API_KEY: !secret google_api_key
  # gh_token — delivers the GitHub PAT to the guest for VM-side git push, and lets
  # iron-proxy inject it on egress to github.com (network.allow). The guest only ever
  # sees the opaque __DEVM_SECRET_gh_token__ token.
  GH_TOKEN: !secret gh_token

# Persistent named volumes: Mac-backed stores mounted into the guest that survive
# `devm teardown` (unlike the VM disk). Explicit `label:` on each — the label names
# both the mutagen session and the Mac-side storage dir
# (~/Library/Application Support/devm/volumes/everstone/<label>/). These labels MUST
# stay pinned to the existing dirs (`claude`, `everstone-data`); without them the new
# schema would default the label to the path's leaf (".claude"/".everstone") and
# repoint sync at an empty dir, orphaning the existing Claude state + dev data.
volumes:
  # Claude Code state at its DEFAULT path (~/.claude): OAuth login
  # (.credentials.json), transcripts (projects/), plugins, sessions, settings.
  claude:
    path: /home/devm/.claude
    label: claude
  # everstone's dev data — the Hermes profile (skills), the dev vault, CouchDB, the
  # livesync-bridge state, and config.yaml. EVERSTONE_DATA_DIR/EVERSTONE_CONFIG point
  # here. A gitignored workspace dir would be wiped by the fresh clone, so it lives in
  # this volume instead.
  everstone-data:
    path: /home/devm/.everstone
    label: everstone-data

# iron-proxy egress allowlist (per-project; enforced by SNI/Host on the Mac). Gates
# the RUNNING VM only — the provisioning window (install()/startup() in devm.sh) runs
# with unrestricted egress. `docker: true` auto-allows the Docker Hub hosts, BUT a
# live reconcile rebuilds the running allowlist from THIS list and drops the implicit
# ones — so they're pinned explicitly here to survive reconciles. The rest are what
# the image build + agent need: Alpine, Go (caddy), CouchDB source, Rust/engraph
# crates, Python wheels, JSR (livesync-bridge/Deno), Telegram bot API, ChatGPT/Codex.
network:
  allow:
    # Docker Hub (buildkit `docker/dockerfile` frontend + base-image pulls)
    - registry-1.docker.io
    - auth.docker.io
    - production.cloudfront.docker.com
    - dl-cdn.alpinelinux.org
    - go.dev
    - dl.google.com               # go.dev/dl/* 302-redirects here for the tarball
    - storage.googleapis.com
    - proxy.golang.org
    - sum.golang.org
    - fnm.vercel.app              # fnm install script (tool/lang/node)
    # VM-side git over HTTPS. Clone is public — no auth — but the VM's own push needs
    # the token; the {host, secrets} form injects gh_token on egress here.
    - host: github.com
      secrets: [gh_token]
    - api.github.com              # uv git-dependency resolution (.[all]) + gh metadata
    - objects.githubusercontent.com     # legacy GitHub release-asset CDN
    - release-assets.githubusercontent.com  # current GitHub release-asset CDN (xcaddy/s6/deno/camoufox)
    - registry.npmjs.org          # npm install (camofox-browser) + deno npm: deps
    - nodejs.org                  # Orca ADE relay: node-gyp fetches matching node headers on attach
    - archive.apache.org
    - crates.io
    - static.crates.io
    - index.crates.io
    - pypi.org
    - files.pythonhosted.org
    - jsr.io
    # livesync-bridge (notes sync) — deno fetches its deps from these at build
    # pre-cache time and at runtime. jsr.io + registry.npmjs.org (above/below) cover
    # jsr/npm specifiers; these cover deno.land/x + deno's own downloads.
    - deno.land
    - dl.deno.land
    - api.telegram.org
    # Hermes' Telegram adapter discovers Telegram API fallback IPs via DNS-over-HTTPS
    # before connecting; without these the connection stalls (attempt N/8).
    - cloudflare-dns.com
    - dns.google
    - chatgpt.com
    - "*.openai.com"
    # Claude Code — self-contained allowlist (per `devm recipes get tool/ai/claude`)
    - api.anthropic.com         # Claude API (core)
    - claude.ai                 # OAuth login + install.sh
    - platform.claude.com       # OAuth token exchange + revoke
    - console.anthropic.com     # OAuth token REFRESH (claude.ai accts) — omit ⇒ silent logout
    - downloads.claude.ai       # native installer + plugin downloads
    - raw.githubusercontent.com # plugin marketplace + /release-notes
    - deb.debian.org     # VM base (Ubuntu/Debian) apt packages
    - security.debian.org
    - addons.mozilla.org # Firefox add-ons
    # Agent web_search (Hermes' keyless `ddgs` backend fans out across engines) +
    # reference sites the agent fetches. Add engines here as ddgs adds/denies them.
    - html.duckduckgo.com
    - search.brave.com
    - search.yahoo.com
    - www.google.com
    - www.mojeek.com
    - www.startpage.com
    - en.wikipedia.org
    - grokipedia.com
    # Google web surfaces for the persistent-web-login browser (Camoufox): the sign-in
    # flow (accounts.google.com) and Maps/other Google apps fan out across many
    # *.google.com subdomains, with static assets on gstatic, APIs on googleapis, user
    # content on googleusercontent, and Maps/Photos image tiles on ggpht. Wildcards
    # because Google rotates subdomains dynamically — enumerating exact hosts breaks login.
    - "*.google.com"
    - "*.gstatic.com"
    - "*.googleapis.com"
    - "*.googleusercontent.com"
    - "*.ggpht.com"
    # DuckDB extension repository — DuckDB INSTALL/LOAD fetches extension bundles from
    # here at runtime (engraph's DuckDB backend).
    - extensions.duckdb.org
    # Maps Platform (es_maps_* / es_weather tools): the *.googleapis.com wildcard above
    # already permits egress, but secret INJECTION requires exact-host {host, secrets}
    # entries. es sends the `__DEVM_SECRET_google_api_key__` token as the key
    # (X-Goog-Api-Key header for Places/Routes; ?key= query param for legacy
    # Geocoding); iron-proxy substitutes the real key only on requests to these hosts.
    - host: maps.googleapis.com          # Geocoding API (legacy GET, ?key=)
      secrets: [google_api_key]
    - host: places.googleapis.com        # Places API (New) — search + details
      secrets: [google_api_key]
    - host: routes.googleapis.com        # Routes API — directions + matrix
      secrets: [google_api_key]
    - host: weather.googleapis.com       # Weather API — es_weather
      secrets: [google_api_key]

# everstone's internal Caddy serves the sync surfaces (/db, /caldav, /git, /health)
# inside the VM. It MUST NOT publish on VM :80 — devm runs its OWN Caddy on :80 to
# front `hostname` services. So the dev container publishes on VM :8080 (`just dev`
# -p 8080:80) and this service points there; devm's Caddy fronts
# everstone.test → localhost:8080. `expose_host: true` opts the hostname into devm's
# shared LAN dispatcher on <mac-lan-ip>:42000.
services:
  everstone:
    port: 8080
    hostname: everstone.test
    expose_host: true
