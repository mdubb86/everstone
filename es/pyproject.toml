[project]
name = "es"
version = "0.1.0"
description = "EverStone agent tool-gateway — es_* MCP server + logic clients"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "caldav>=1.3", "icalendar>=5.0", "google-api-python-client>=2", "google-auth>=2", "google-auth-oauthlib>=1", "mcp>=1.0"]

[project.scripts]
es-mcp = "es.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["es*"]

[dependency-groups]
dev = ["pytest>=8", "radicale>=3.2", "requests>=2.31"]
