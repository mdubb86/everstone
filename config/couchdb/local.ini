# CouchDB configuration for Obsidian LiveSync
# Based on: https://raw.githubusercontent.com/vrtmrz/obsidian-livesync/refs/heads/main/utils/couchdb/couchdb-init.sh

[couchdb]
single_node=true
max_document_size = 50000000
database_dir = /opt/data/couchdb
view_index_dir = /opt/data/couchdb

[cluster]
n = 1

[chttpd]
require_valid_user = true
bind_address = 127.0.0.1
port = 5984
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true
bind_address = 127.0.0.1

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true

[couchdb_httpd_auth]
require_valid_user = true

[couch_httpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[admins]
{{COUCHDB_USER}} = {{COUCHDB_PASSWORD}}
